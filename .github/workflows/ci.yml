name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build all
        run: npm run build:all

      - name: Install Lua 5.1 (closest to CC:Tweaked's Cobalt VM)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Smoke test (simulated install + module loading)
        run: npm run test:smoke

      - name: Behaviour tests (fake CC:Tweaked environment)
        run: npm run test:behavior

      - name: Installer tests (fake CC:Tweaked file system and http)
        run: npm run test:installer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: embercore-build
          path: |
            luas
            manifests
